# Netlify configuration

# Prerendering drives a headless Chrome, which Puppeteer downloads on install.
# Pinning the cache inside node_modules keeps it where Netlify's dependency
# cache can find it between builds instead of re-downloading Chrome every time.
[build.environment]
  PUPPETEER_CACHE_DIR = "/opt/build/repo/node_modules/.puppeteer-cache"

# SPA routing

# Force HTTPS and redirect www to non-www
[[redirects]]
  from = "https://www.habitat-builder.com/*"
  to = "https://habitat-builder.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://habitat-builder.com/*"
  to = "https://habitat-builder.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.habitat-builder.com/*"
  to = "https://habitat-builder.com/:splat"
  status = 301
  force = true

# SPA routing - must be last
[[redirects]]
  from = "/*"
  to = "/shell.html"
  status = 200
