<!doctype html>
<!-- class="dark" is set here, not in JS. useTheme() adds it in an effect, which
     runs after first paint — every cold load flashed the light theme for a frame. -->
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/HB.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/HB.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover" />
    
    
     <link rel="manifest" href="/manifest.json" /> 
     <meta name="theme-color" content="#10b981" /> 
     <meta name="mobile-web-app-capable" content="yes" /> 
     <meta name="apple-mobile-web-app-capable" content="yes" /> 
     <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" /> 
     <meta name="apple-mobile-web-app-title" content="Habitat Builder" /> 
    
    <!-- Preconnect to improve loading performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- Default meta tags (the SEO component overrides these once React runs) -->
    <title>Habitat Builder - Reptile & Amphibian Enclosure Planner</title>
    <meta name="description" content="Plan the perfect reptile or amphibian enclosure in minutes. Get a custom shopping list, step-by-step build guide, and care calendar for 18+ species. Free to use." />

    <!-- Open Graph / Twitter.
         These MUST be here in the static HTML, not only in the SEO component.
         No social scraper executes JavaScript: Facebook, X, Discord, Slack,
         LinkedIn and iMessage all read the raw document, so anything React
         injects later is invisible to every one of them. Until the static
         routes are prerendered these are what every shared link shows.
         The image is generated by `npm run generate-og-image`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Habitat Builder" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://habitat-builder.com/" />
    <meta property="og:title" content="Habitat Builder - Reptile & Amphibian Enclosure Planner" />
    <meta property="og:description" content="Know your setup is right, not just recorded. Enclosure planning, Ferguson-zone UVB guidance and husbandry validation for 18+ reptile and amphibian species." />
    <meta property="og:image" content="https://habitat-builder.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Habitat Builder - know your setup is right, not just recorded" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Habitat Builder - Reptile & Amphibian Enclosure Planner" />
    <meta name="twitter:description" content="Know your setup is right, not just recorded. Enclosure planning, Ferguson-zone UVB guidance and husbandry validation for 18+ reptile and amphibian species." />
    <meta name="twitter:image" content="https://habitat-builder.com/og-image.png" />

    <!-- Deliberately NO static canonical link element here. Every route is
         served this same file, so a hard-coded canonical would tell any
         crawler that has not yet run the JS that /blog/whatever IS the home
         page — inviting it to fold the entire site into one URL. The SEO
         component sets the real one per route. The og:url above is wrong in
         the same way, but a share card linking home is a far smaller price
         than losing every page to deduplication. Prerendering fixes both. -->
    
    <!-- Verification tags (add your own) -->
    <!-- <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" /> -->
    <!-- <meta name="msvalidate.01" content="YOUR_BING_VERIFICATION_CODE" /> -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <!-- type="module" so Vite substitutes import.meta.env at build time -->
    <script type="module">
      if ('serviceWorker' in navigator) {
        if (import.meta.env.DEV) {
          // The service worker caches every GET, including Vite's /__vite_ping.
          // In dev that makes the ping succeed from cache even when the HMR
          // socket is dead, trapping the page in Vite's reload loop — and it
          // serves stale modules on top of that. Tear down any worker left
          // over from a previous visit or a production build on this origin.
          navigator.serviceWorker.getRegistrations().then((registrations) => {
            registrations.forEach((registration) => registration.unregister());
          });
          caches.keys().then((keys) => keys.forEach((key) => caches.delete(key)));
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js')
              .then((registration) => {
                console.log('Service Worker registered:', registration.scope);
              })
              .catch((error) => {
                console.log('Service Worker registration failed:', error);
              });
          });
        }
      }
    </script>
  </body>
</html>
